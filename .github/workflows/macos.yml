name: macOS Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      # The bundled geography is generated from the pinned sources in
      # Data/source. Regenerating it and checking that nothing changes
      # catches a hand-edited runtime asset, or a change to AtlasDataTool
      # that was never re-run.
      #
      # Only the JSON is compared. The imagery goes through AppKit's JPEG
      # encoder, which is not guaranteed to produce identical bytes
      # across macOS versions, so comparing it would fail for reasons
      # that have nothing to do with the repository's contents.
      - name: Verify the generated geography is reproducible
        run: |
          swift run AtlasDataTool
          if ! git diff --quiet -- Sources/AtlasGeographyData/Resources; then
            echo "The committed geography asset differs from what AtlasDataTool generates." >&2
            echo "Run 'swift run AtlasDataTool' and commit the result." >&2
            git diff --stat -- Sources/AtlasGeographyData/Resources >&2
            exit 1
          fi

      - name: Build the app bundle
        run: Tools/make-app-bundle.sh release
